name: Build Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build requirements
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Restore upload key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > blackjack-upload-key.jks
          test -s blackjack-upload-key.jks
          ls -lh blackjack-upload-key.jks

      - name: Cache Android downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-global-${{ runner.os }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Clean previous project build
        run: |
          rm -rf .buildozer

      - name: Build signed Android App Bundle
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/blackjack-upload-key.jks
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          buildozer -v android release

      - name: Show generated files
        if: always()
        run: |
          find bin -maxdepth 2 -type f -print || true

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-google-play-aab
          path: bin/*.aab
          if-no-files-found: error
